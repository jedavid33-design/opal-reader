<script>
  // Startup-only crash notice. Does not touch books, audio, caches or storage.
  (function () {
    function showStartupFailure() {
      var root = document.getElementById("app");
      if (!root || root.children.length || root.dataset.startupError) return;
      root.dataset.startupError = "1";
      var note = document.createElement("div");
      note.style.cssText = "max-width:34rem;margin:18vh auto 0;padding:1.5rem;color:#46314f;font:16px/1.55 -apple-system,BlinkMacSystemFont,sans-serif;text-align:center";
      note.textContent = "Opal Reader could not load its interface (v1.4.121). Close and reopen the app. Do not delete the app or clear website data; report this screen if it persists.";
      root.appendChild(note);
    }
    addEventListener("error", showStartupFailure, true);
    addEventListener("unhandledrejection", showStartupFailure, true);
  })();
</script></head><body><div id="app"></div></body></html>
